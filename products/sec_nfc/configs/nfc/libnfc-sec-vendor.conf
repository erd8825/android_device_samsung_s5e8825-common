# Clock Source Information
# - 0x12 - 26MHz PLL
# - 0x11 - 19.2MHz PLL
FW_CFG_CLK_SPEED=0x12

# FW Base Address
# - 0x2000 - SEN4
FW_BASE_ADDRESS=0x2000

# Firmware paths
FW_DIR_PATH="/vendor/firmware/nfc/"
FW_FILE_NAME="sec_s3nrn4v_firmware.bin"

RF_HW_DIR_PATH="/vendor/etc/nfc/"
RF_HW_FILE_NAME="sec_s3nrn4v_hwreg.bin"

RF_SW_DIR_PATH="/vendor/etc/nfc/"
RF_SW_FILE_NAME="sec_s3nrn4v_swreg.bin"

# Driver path
POWER_DRIVER="/dev/sec-nfc"
TRANS_DRIVER="/dev/sec-nfc"

# Trace Level
# - Trace level - 0: only err; 1: 0 + debug; 2: 1 + trace
# - Data trace - 0: not display; 1: simply; 2: all of data trace
TRACE_LEVEL=2
DATA_TRACE=2

# NFC Sleep Timing
SLEEP_TIMEOUT=1000

# FW Update Option
# - 0 - Download for different version (default)
# - 1 - Download for upper version
# - 2 - Force Download
FW_UPDATE_MODE=0

# Offhost UICC
# If you use NCI 1.0 mode, remove this parameter for VTS
# 83 - NCI v2.0
OFFHOST_ROUTE_UICC={83}

# Offhost eSE
# If you use NCI 1.0 mode, remove this parameter for VTS
# 82 - NCI v2.0
OFFHOST_ROUTE_ESE={82}

# Default Route
# - 0x82 - eSE
# - 0x83 - Host
DEFAULT_ROUTE=0x83

# Default Offhost Route
DEFAULT_OFFHOST_ROUTE=0x82

# Default System Code Route
# 0x00 - Host
# 0x82 - eSE
# 0x83 - UICC
DEFAULT_SYS_CODE_ROUTE=0x82

# Presence Check Algorithm
# 0 - Automatic select for below 4 method (default)
# 1 - Read Empty I block
# 2 - Sleep/Wakeup Command
# 3 - Read binary for CH0(K version method)
# 4 - Read binary for CH3
# 5 - ACK/NACK
PRESENCE_CHECK_ALGORITHM=5

# NFA Proprietary Configuration
# - byte[0] NCI_PROTOCOL_18092_ACTIVE
# - byte[1] NCI_PROTOCOL_B_PRIME
# - byte[2] NCI_PROTOCOL_DUAL
# - byte[3] NCI_PROTOCOL_15693 - 15693 : 0x80 (NCI 1.0); T5T : 0x06 (NCI 2.0)
# - byte[4] NCI_PROTOCOL_KOVIO
# - byte[5] NCI_PROTOCOL_MIFARE - LSI FW : 0x81; GSI FW : 0x80
# - byte[6] NCI_DISCOVERY_TYPE_POLL_KOVIO
# - byte[7] NCI_DISCOVERY_TYPE_POLL_B_PRIME
# - byte[8] NCI_DISCOVERY_TYPE_LISTEN_B_PRIME
NFA_PROPRIETARY_CFG={00, 81, 82, 80, 8A, 80, 70, 74, F4}

# Extended APDU length for ISO_DEP
# 161 - Default length if not supported
ISO_DEP_MAX_TRANSCEIVE=0xFEFF

# eSE Delay
ESE_DELAY=0x7D0

# CP Trigger type
CP_TRIGGER_TYPE=1

# CP Default Type
CP_DEFAULT_TYPE=0

# Coldreset support
COLDRESET_SUPPORT=1

# SN4V coldreset support
AP_COLDRESET_ENABLE=0
CP_COLDRESET_ENABLE=1
